name: Test
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'AspNetAuthExample/**'
      - 'example*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'AspNetAuthExample/**'
      - 'example*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.15'
          enable-cache: true
      - run: make install
      - name: Check lint, formatting, and types
        run: uv run --locked make check

  integration-image:
    name: Build integration server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: AspNetAuthExample
          tags: aspnet_server:ci
          outputs: type=docker,dest=${{ runner.temp }}/aspnet-server.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: aspnet-server
          path: ${{ runner.temp }}/aspnet-server.tar
          retention-days: 1
          compression-level: 0

  test-websockets:
    name: Python ${{ matrix.python }} / websockets ${{ matrix.websockets }}
    needs: integration-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.15']
        websockets: ['==15.0.1', '>=16,<17', '>=17,<18']
        exclude:
          - python: '3.10'
            websockets: '>=17,<18'
    env:
      PYSIGNALR_TEST_IMAGE: aspnet_server:ci
      WEBSOCKETS: ${{ matrix.websockets }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-suffix: websockets-${{ matrix.websockets }}
      - uses: actions/download-artifact@v4
        with:
          name: aspnet-server
          path: ${{ runner.temp }}
      - name: Load integration server
        run: docker load --input "$RUNNER_TEMP/aspnet-server.tar"
      - name: Run compatibility tests
        env:
          COVERAGE: ${{ matrix.python == '3.15' && matrix.websockets == '>=17,<18' && '1' || '0' }}
        run: make test-websockets
      - name: Save coverage
        if: matrix.python == '3.15' && matrix.websockets == '>=17,<18'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  test-unit:
    # Python 3.10 and 3.15 on Linux x64 are covered above.
    name: Unit tests / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.14'
          - os: ubuntu-24.04-arm
            python: '3.15'
          - os: macos-15
            python: '3.15'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv run --locked make test-unit
